name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (tools, extraction, gate, agent loop, metrics, task suite)
        run: npm test

      # No model is bundled: System 1 streams from Hugging Face (VishalMysore/layaForWebTrained, produced by the
      # layaForWeb project) and System 2 (WebLLM) from the MLC model repositories, so the site stays ~36 MB.
      - name: Assemble the site
        run: node scripts/prepare_site.mjs

      - name: Check the model repository is reachable
        run: curl -fsSL https://huggingface.co/VishalMysore/layaForWebTrained/resolve/main/manifest.json | head -c 200

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
